<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAEPChef - Plataforma Gastronômica</title>
  
  <!-- Fontes Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ======================================================== -->
  <!-- 1. CABEÇALHO DA APLICAÇÃO                                -->
  <!-- ======================================================== -->
  <header class="app-header">
    <div class="header-container">
      
      <!-- 1.1 Seção Usuário -->
      <div class="user-section" id="userSection">
        <div class="user-avatar-wrapper">
          <img src="/imagens_usuarios/saepChef.jpg" alt="Foto do Usuário" id="headerUserAvatar" class="user-avatar">
        </div>
        <span class="user-handle" id="headerUserHandle">@SAEPChef</span>
        <button type="button" class="btn-perfil" id="btnVerPerfil" disabled>Ver Perfil</button>
      </div>

      <!-- 1.2 Seção Empresa -->
      <div class="company-section" id="companySection">
        <h1 class="company-logo" id="logoSaepChef" title="Voltar ao início">SAEPChef</h1>
      </div>

      <!-- 1.3 Seção Login/Logout -->
      <div class="auth-section" id="authSection">
        <button type="button" class="btn-auth" id="btnAuthAction">Login</button>
      </div>

    </div>
  </header>

  <!-- ======================================================== -->
  <!-- MENU LATERAL DO CHEF (DRAWER)                            -->
  <!-- ======================================================== -->
  <aside class="sidebar-chef" id="sidebarChef" aria-hidden="true">
    <div class="sidebar-header">
      <h2 class="sidebar-title">Painel do Chef</h2>
      <button type="button" class="btn-close-sidebar" id="btnCloseSidebar" aria-label="Fechar menu lateral">
        <img src="/icones/close.svg" alt="Fechar" class="icon-close">
      </button>
    </div>

    <div class="sidebar-content">
      <div class="chef-profile-card">
        <img src="/imagens_usuarios/saepChef.jpg" alt="Avatar do Chef" id="sidebarChefAvatar" class="sidebar-avatar">
        <h3 id="sidebarChefName" class="sidebar-chef-name">Chef</h3>
        <p id="sidebarChefHandle" class="sidebar-chef-handle">@chef</p>
      </div>

      <div class="chef-stats">
        <div class="stat-box">
          <span class="stat-number" id="statFavoritos">0</span>
          <span class="stat-label">Favoritos</span>
        </div>
        <div class="stat-box">
          <span class="stat-number" id="statReceitas">0</span>
          <span class="stat-label">Receitas</span>
        </div>
      </div>

      <div class="sidebar-actions">
        <button type="button" class="btn-suas-receitas" id="btnSuasReceitas">
          Suas receitas
        </button>
      </div>
    </div>
  </aside>

  <!-- Overlay para fechar drawer/modal ao clicar fora -->
  <div class="backdrop" id="backdrop"></div>

  <!-- ======================================================== -->
  <!-- CONTEÚDO PRINCIPAL                                       -->
  <!-- ======================================================== -->
  <main class="main-container">

    <!-- SEÇÃO 1: MURAL PÚBLICO DE RECEITAS E BUSCA -->
    <section class="mural-view" id="muralView">
      
      <!-- 2.1 Campo de Busca -->
      <div class="search-container">
        <div class="search-box">
          <input 
            type="text" 
            id="inputBuscaChef" 
            placeholder="Digite o nome do chef... ex: @chef1" 
            autocomplete="off"
          >
          <button type="button" class="btn-search" id="btnBuscarChef" aria-label="Buscar receitas do chef">
            <img src="/icones/lupa.svg" alt="Buscar" class="icon-lupa">
          </button>
        </div>
        <!-- Mensagem de erro de busca -->
        <div class="search-feedback" id="searchFeedback"></div>
      </div>

      <!-- 2.2 Mural de Receitas (3 Colunas) -->
      <div class="mural-header">
        <h2 class="section-heading" id="muralHeading">Receitas da Comunidade</h2>
        <button type="button" class="btn-reset-filter" id="btnResetFilter" style="display: none;">
          Ver todas as receitas
        </button>
      </div>

      <div class="recipes-grid" id="recipesGrid">
        <!-- Renderizado dinamicamente via JS -->
      </div>
    </section>

    <!-- SEÇÃO 2: GERENCIAMENTO DE RECEITAS DO CHEF ("SUAS RECEITAS") -->
    <section class="chef-recipes-view" id="chefRecipesView" style="display: none;">
      
      <div class="view-header-bar">
        <button type="button" class="btn-voltar-mural" id="btnVoltarMural">
          &larr; Voltar ao Mural
        </button>
        <h2>Gestão de Receitas</h2>
      </div>

      <!-- 1. Formulário de Cadastro de Receitas -->
      <div class="card-form-cadastro">
        <h3 class="form-title">Cadastrar Nova Receita</h3>

        <form id="formCadastroReceita" novalidate>
          
          <div class="form-group">
            <label for="inputTituloReceita" class="form-label">Título da Receita</label>
            <input 
              type="text" 
              id="inputTituloReceita" 
              name="titulo_receita" 
              class="form-control" 
              placeholder="Risoto de Funghi"
            >
            <span class="error-feedback" id="errorTitulo"></span>
          </div>

          <div class="form-group">
            <label for="inputOrigemReceita" class="form-label">Origem da receita</label>
            <input 
              type="text" 
              id="inputOrigemReceita" 
              name="origem_receita" 
              class="form-control" 
              placeholder="Itália"
            >
            <span class="error-feedback" id="errorOrigem"></span>
          </div>

          <div class="form-group">
            <label class="form-label">Imagem</label>
            <div class="custom-file-upload">
              <label for="inputImagemReceita" class="btn-file-trigger">Escolher arquivo</label>
              <input 
                type="file" 
                id="inputImagemReceita" 
                name="imagem" 
                accept=".jpg,.jpeg,.png,.gif,.webp" 
                class="hidden-file-input"
              >
              <span class="file-name-display" id="fileChosenLabel">Nenhum arquivo escolhido</span>
            </div>
            <span class="error-feedback" id="errorImagem"></span>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-cadastrar" id="btnCadastrarReceita">Cadastrar</button>
          </div>

        </form>
      </div>

      <!-- 2. Exibição das Receitas Cadastradas pelo Chef -->
      <div class="chef-recipes-list-section">
        <h3 class="subheading">Receitas Cadastradas</h3>
        
        <div class="chef-recipes-grid" id="chefRecipesGrid">
          <!-- Renderizado dinamicamente via JS -->
        </div>
      </div>

    </section>

  </main>

  <!-- ======================================================== -->
  <!-- 3. RODAPÉ DA APLICAÇÃO                                   -->
  <!-- ======================================================== -->
  <footer class="app-footer">
    <div class="footer-container">
      
      <!-- Esquerda: Nome da empresa -->
      <div class="footer-left">
        <span class="footer-brand">SAEPChef</span>
      </div>

      <!-- Centro: Ícones redes sociais -->
      <div class="footer-center">
        <a href="#instagram" class="social-icon" title="Instagram" target="_blank" rel="noopener">
          <img src="/icones/instagram.svg" alt="Instagram">
        </a>
        <a href="#tiktok" class="social-icon" title="TikTok" target="_blank" rel="noopener">
          <img src="/icones/tiktok.svg" alt="TikTok">
        </a>
        <a href="#linkedin" class="social-icon" title="LinkedIn" target="_blank" rel="noopener">
          <img src="/icones/linkedin.svg" alt="LinkedIn">
        </a>
        <a href="#youtube" class="social-icon" title="YouTube" target="_blank" rel="noopener">
          <img src="/icones/youtube.svg" alt="YouTube">
        </a>
      </div>

      <!-- Direita: Copyright -->
      <div class="footer-right">
        <span class="footer-copy">Copyright 2026-2027</span>
      </div>

    </div>
  </footer>

  <!-- ======================================================== -->
  <!-- MODAL DE LOGIN                                           -->
  <!-- ======================================================== -->
  <div class="modal-overlay" id="modalLogin" aria-hidden="true" role="dialog" aria-labelledby="modalLoginTitle">
    <div class="modal-dialog">
      
      <div class="modal-header">
        <h2 class="modal-title" id="modalLoginTitle">Login</h2>
        <button type="button" class="btn-modal-close" id="btnCloseModalLogin" aria-label="Fechar modal">
          <img src="/icones/close.svg" alt="Fechar" class="icon-modal-close">
        </button>
      </div>

      <form id="formLogin" class="modal-body" novalidate>
        
        <div class="form-group">
          <label for="loginEmail" class="form-label">E-mail</label>
          <input 
            type="email" 
            id="loginEmail" 
            class="form-control" 
            placeholder="Digite seu e-mail"
            autocomplete="email"
          >
          <span class="error-feedback" id="errorLoginEmail"></span>
        </div>

        <div class="form-group">
          <label for="loginSenha" class="form-label">Senha</label>
          <input 
            type="password" 
            id="loginSenha" 
            class="form-control" 
            placeholder="Digite sua senha"
            autocomplete="current-password"
          >
          <span class="error-feedback" id="errorLoginSenha"></span>
        </div>

        <!-- Alerta de erro geral (ex: Usuário não encontrado ou senha incorreta) -->
        <div class="login-general-error" id="loginGeneralError"></div>

        <div class="modal-buttons">
          <button type="button" class="btn-cancelar" id="btnCancelLogin">Cancelar</button>
          <button type="submit" class="btn-submit-login" id="btnSubmitLogin">Login</button>
        </div>

      </form>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
